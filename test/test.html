<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTOTUSNOBETO - 2ª Edição do Rio</title>
    <style>
        /* Reset e base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #1a1a1a;
            --color-secondary: #c41e3a;
            --color-accent: #ff6b35;
            --color-background: #fafafa;
            --color-surface: #ffffff;
            --color-text: #2c2c2c;
            --color-text-light: #6b7280;
            --color-border: #e5e7eb;
            --color-overlay: rgba(0, 0, 0, 0.8);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --spacing-3xl: 4rem;
            --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--color-surface);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            padding: var(--spacing-3xl);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-secondary), var(--color-accent));
        }

        /* Typography */
        .title {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
            letter-spacing: -0.03em;
            line-height: 0.9;
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--color-text-light);
            margin-bottom: var(--spacing-3xl);
            font-weight: 500;
            letter-spacing: 0.025em;
        }

        /* Image section */
        .image-section {
            margin-bottom: var(--spacing-3xl);
            position: relative;
        }

        .image-container {
            display: inline-block;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: var(--transition-normal);
            cursor: pointer;
            position: relative;
            background: var(--color-surface);
        }

        .image-container::after {
            content: '🔍';
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            opacity: 0;
            transform: scale(0.8);
            transition: var(--transition-normal);
            backdrop-filter: blur(10px);
        }

        .image-container:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-2xl);
        }

        .image-container:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .product-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            transition: var(--transition-normal);
        }

        .image-container:hover .product-image {
            transform: scale(1.02);
        }

        /* Date section */
        .date-section {
            border-top: 2px solid var(--color-border);
            padding-top: var(--spacing-xl);
            position: relative;
        }

        .date-section::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--color-secondary), var(--color-accent));
        }

        .date-label {
            font-size: 0.875rem;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: var(--spacing-md);
            font-weight: 600;
        }

        .date-display {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 900;
            color: var(--color-secondary);
            letter-spacing: -0.02em;
            line-height: 1;
            position: relative;
        }

        .date-separator {
            color: var(--color-accent);
            margin: 0 clamp(0.5rem, 2vw, 1rem);
            position: relative;
            top: -0.1em;
        }

        /* Modal styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-overlay);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-slow);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-2xl);
            transform: scale(0.9);
            transition: var(--transition-slow);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-image {
            width: 100%;
            height: auto;
            display: block;
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: var(--spacing-md);
            right: var(--spacing-md);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
            z-index: 1001;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        .modal-close:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        /* Loading placeholder */
        .image-placeholder {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: var(--radius-xl);
            display: none;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: var(--spacing-md);
            }

            .card {
                padding: var(--spacing-2xl) var(--spacing-xl);
            }

            .image-section {
                margin-bottom: var(--spacing-2xl);
            }

            .date-section {
                padding-top: var(--spacing-lg);
            }

            .modal {
                padding: var(--spacing-md);
            }

            .modal-close {
                top: var(--spacing-sm);
                right: var(--spacing-sm);
                width: 40px;
                height: 40px;
                font-size: 1.125rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
            }

            .card {
                padding: var(--spacing-xl) var(--spacing-lg);
                border-radius: var(--radius-xl);
            }

            .image-section {
                margin-bottom: var(--spacing-xl);
            }

            .modal {
                padding: var(--spacing-sm);
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: var(--spacing-lg) var(--spacing-md);
            }
        }

        /* Focus states for accessibility */
        .image-container:focus-visible {
            outline: 3px solid var(--color-accent);
            outline-offset: 4px;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode */
        @media (prefers-contrast: high) {
            :root {
                --color-border: #000000;
                --shadow-lg: 0 0 0 2px #000000;
                --shadow-xl: 0 0 0 3px #000000;
                --shadow-2xl: 0 0 0 4px #000000;
            }
        }

        /* Print styles */
        @media print {
            .modal {
                display: none !important;
            }
            
            .card {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="title">#OTOTUSNOBETO</h1>
            <p class="subtitle">2ª Edição • TOTUS NO BETO</p>
            
            <div class="image-section">
                <div 
                    class="image-container" 
                    tabindex="0" 
                    role="button" 
                    aria-label="Clique para ampliar a imagem das camisetas"
                    onclick="openModal()"
                    onkeydown="handleKeyPress(event)"
                >
                    <img 
                        src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-qlXR9P2bMqYaQeHtYIt0hYIOOa4r8M.png" 
                        alt="Camisetas OTOTUSNOBETO - Design Totus Tuus com arte religiosa, mostrando frente e verso das camisetas vermelhas"
                        class="product-image"
                        loading="lazy"
                        onerror="handleImageError(this)"
                    >
                </div>
            </div>

            <div class="date-section">
                <div class="date-label">Data do Evento</div>
                <div class="date-display">
                    18<span class="date-separator">•</span>OUT
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="imageModal" onclick="closeModal(event)">
        <div class="modal-content">
            <button 
                class="modal-close" 
                onclick="closeModal()"
                aria-label="Fechar modal"
                title="Fechar (ESC)"
            >
                ×
            </button>
            <img 
                src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-qlXR9P2bMqYaQeHtYIt0hYIOOa4r8M.png" 
                alt="Camisetas OTOTUSNOBETO - Visualização ampliada"
                class="modal-image"
                id="modalImage"
            >
        </div>
    </div>

    <script>
        // Modal functionality
        function openModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Focus management
            const closeButton = modal.querySelector('.modal-close');
            closeButton.focus();
        }

        function closeModal(event) {
            // Don't close if clicking on the image itself
            if (event && event.target.classList.contains('modal-image')) {
                return;
            }
            
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            
            // Return focus to the image container
            document.querySelector('.image-container').focus();
        }

        // Keyboard navigation
        function handleKeyPress(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openModal();
            }
        }

        // Global keyboard events
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const modal = document.getElementById('imageModal');
                if (modal.classList.contains('active')) {
                    closeModal();
                }
            }
        });

        // Image error handling
        function handleImageError(img) {
            const placeholder = document.createElement('div');
            placeholder.className = 'image-placeholder';
            placeholder.style.display = 'block';
            placeholder.innerHTML = `
                <div style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 100%;
                    color: var(--color-text-light);
                    font-weight: 500;
                    flex-direction: column;
                    gap: var(--spacing-md);
                ">
                    <div style="font-size: 2rem;">📷</div>
                    <div>Imagem não disponível</div>
                </div>
            `;
            
            img.parentNode.replaceChild(placeholder, img);
            
            // Also update modal image
            const modalImg = document.getElementById('modalImage');
            modalImg.style.display = 'none';
        }

        // Performance optimizations
        document.addEventListener('DOMContentLoaded', function() {
            // Preload modal image
            const img = new Image();
            img.src = 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-qlXR9P2bMqYaQeHtYIt0hYIOOa4r8M.png';
            
            // Add loading state
            const mainImage = document.querySelector('.product-image');
            const placeholder = document.querySelector('.image-placeholder');
            
            if (mainImage.complete && mainImage.naturalHeight !== 0) {
                // Image already loaded
                return;
            }
            
            // Show placeholder while loading
            if (placeholder) {
                placeholder.style.display = 'block';
                mainImage.style.display = 'none';
            }
            
            mainImage.addEventListener('load', function() {
                if (placeholder) {
                    placeholder.style.display = 'none';
                    mainImage.style.display = 'block';
                }
            });
        });

        // Smooth scroll behavior for better UX
        if ('scrollBehavior' in document.documentElement.style) {
            document.documentElement.style.scrollBehavior = 'smooth';
        }

        // Add touch support for mobile
        let touchStartY = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', function(event) {
            touchStartY = event.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', function(event) {
            touchEndY = event.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const modal = document.getElementById('imageModal');
            if (!modal.classList.contains('active')) return;
            
            const swipeDistance = touchStartY - touchEndY;
            const minSwipeDistance = 50;
            
            // Swipe up to close modal
            if (swipeDistance > minSwipeDistance) {
                closeModal();
            }
        }123.456.789-10

        // Intersection Observer for performance
        if ('IntersectionObserver' in window) {
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.src) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                            imageObserver.unobserve(img);
                        }
                    }
                });
            });

            // Observe images for lazy loading
            document.querySelectorAll('img[data-src]').forEach(img => {
                imageObserver.observe(img);
            });
        }
    </script>
</body>
</html>
